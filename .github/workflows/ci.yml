name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

      - name: Expo project check
        run: npx expo-doctor@latest
        env:
          # Expo releases patch versions often, so this check alone must not fail the build.
          # The next step reports outdated packages as a warning instead.
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'

      - name: Expo package versions (warning only)
        run: |
          if ! npx expo install --check; then
            echo "::warning title=Expo packages out of date::Run 'npx expo install --fix' on a branch and open a pull request."
          fi

      - name: Bundle for Android and iOS
        run: npm run bundle:check
        env:
          EXPO_PUBLIC_API_URL: http://localhost:4000
